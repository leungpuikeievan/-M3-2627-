</section><dialog id="modal"></dialog><footer>慢慢想，動手數，每一步都是小進步。<span>離線 HTML 版 · 無倒數 · 無需學生姓名</span></footer><script>const $=s=>document.querySelector(s),app=$('#app'),modal=$('#modal');
const games=[
['count','🍎','蘋果數一數','點一下蘋果，再選出總數。','數感暖身','#f9e8dd'],

['split','🦋','蝴蝶分兩家','把蝴蝶分成兩群，完成數的合成。','數的合成','#f3e6ec'],

];

  [CIRCLE_SUBTRACTION_ID,'⭕','圈圈減法屋','畫圈、劃去，再數還有多少。','減法練習','#f7e4e7'],

let stage=new URLSearchParams(location.search).get('stage')==='2'?2:1,filter='全部',sound=false,settings={choices:3,range:0},records=[];

function bindGameMenu(renderMenu) {

    status.textContent = finished
      ? `跳完 ${q.b} 步，停在 ${position}。請選答案。`
      : `已跳 ${step}／${q.b} 步。火箭在 ${position}。`;
  }

  function jumpBack(event) {
    if (done || step >= q.b) return;
    step++;
    updateRocket();
    speak(String(q.a - step));
    if (event.detail === 0 && event.currentTarget.disabled) {
      const nextControl = step === q.b
        ? app.querySelector('[data-answer]')
        : numbers[q.a - step - 1];
      nextControl.focus({ preventScroll: true });
    }
  }

  numbers.forEach(tick => tick.addEventListener('click', jumpBack));
  back.addEventListener('click', jumpBack);
  updateRocket();
}

挑戰</button></div>\n</div>\n<section class=\"board\" aria-label=\"__FINGER_TITLE__\">\n<div id=\"progress\" class=\"progress\"></div>\n<p class=\"equation\" id=\"equation\"></p>\n<p class=\"instruction\" id=\"instruction\"></p>\n<button id=\"start-count\" class=\"heart-start\" type=\"button\" hidden><span aria-hidden=\"true\">♥</span><strong id=\"heart-number\"></strong></button>\n<p class=\"count\" id=\"count\" aria-live=\"polite\"></p>\n<div id=\"hands\" class=\"hands\"></div>\n<p class=\"steps\" id=\"steps\"></p>\n<div id=\"choices\" class=\"choices\" hidden aria-label=\"答案選項\"></div>\n<p id=\"feedback\" class=\"feedback\" role=\"status\"></p>\n<div class=\"actions\">\n<button id=\"hint\" hidden>看提示</button>\n<button id=\"reset\">重數這題</button>\n<button id=\"next\" class=\"primary\" hidden>下一題 →</button>\n</div>\n</section>\n</main>\n<footer>每輪 __FINGER_ROUND_LENGTH__ 題 · 不設限時 · 不用輸入姓名</footer>\n\n<script>\nconst el = id => document.getElementById(id);\nconst backwards = __COUNT_BACKWARD__;\nconst operator = backwards ? ' − ' : ' ＋ ';\nconst fingerNames = ['拇指', '食指', '中指', '無名指', '尾指'];\nconst exercises = backwards ? {\n  1: [[5,2],[4,1],[3,2],[5,1],[4,2],[3,1],[5,3],[4,3],[2,1],[5,5],\n      [6,2],[7,3],[8,3],[9,4],[10,5],[6,1],[7,5],[8,6],[9,7],[10,8]],\n  2: [[11,3],[12,4],[14,5],[12,3],[13,4],[16,4],[14,6],[13,6],[14,7],[15,8],\n      [15,9],[16,8],[17,6],[18,6],[13,5],[17,9],[16,7],[18,8],[15,7],[18,9]]\n} : {\n  1: [[5,2],[6,3],[7,1],[4,4],[8,2],[3,2],[4,3],[5,4],[6,4],[8,1]],\n  2: [[13,4],[14,6],[15,6],[16,3],[17,5],[8,5],[9,4],[11,5],[12,6],[14,4]]\n};\nlet stage = __START_STAGE__;\nlet guided = true;\nlet question = 0;\nlet counted = 0;\nlet solved = false;\nlet completed = false;\n\nfunction questionCount() {\n  return exercises[stage].length;\n}\n\nfunction questionData() {\n  return exercises[stage][question];\n}\n\nfunction showFeedback(message, good = false) {\n  el('feedback').textContent = message;\n  el('feedback').classList.toggle('good', good);\n}\n\nfunction showCount() {\n  const [first, second] = questionData();\n  el('count').innerHTML = counted === 0\n    ? '心裏的數 <strong>' + first + '</strong>'\n    : guided\n      ? '數到 <strong>' + (backwards ? first - counted : first + counted) + '</strong>'\n      : '已收起 <strong>' + counted + ' / ' + second + '</strong> 隻';\n  el('steps').textContent = counted === second\n    ? '手指數完了。想一想，最後數到哪個數？'\n    : backwards ? '每收起一隻手指，就向後數一個數。' : '每點一隻手指，就說出下一個數。';\n}\n\nfunction renderHands(second) {\n  el('hands').replaceChildren();\n  const fingers = [];\n  const [first] = questionData();\n  for (let start = 0; start < second; start += 5) {\n    const group = document.createElement('div');\n    const row = document.createElement('div');\n    const palm = document.createElement('div');\n    row.className = 'hand';\n    const handName = start === 0 ? '右手' : '左手';\n    if (backwards) {\n      const label = document.createElement('p');\n      label.className = 'back-hand-name';\n      label.textContent = handName;\n      group.append(label);\n    }\n    palm.className = 'palm';\n    palm.setAttribute('aria-hidden', 'true');\n    for (let i = start; i < Math.min(start + 5, second); i++) {\n      const button = document.createElement('button');\n      button.className = backwards ? 'finger back-finger' : 'finger';\n      button.textContent = '•';\n      button.disabled = backwards && i !== 0;\n      const fingerName = backwards ? handName + fingerNames[i % 5] : '第 ' + (i + 1) + ' 隻手指';\n      button.setAttribute('aria-label', '收起' + fingerName);\n      button.onclick = event => {\n        button.disabled = true;\n        button.classList.add('folded');\n        counted++;\n        button.textContent = backwards && guided ? String(first - counted) : '✓';\n        if (backwards) {\n          button.setAttribute('aria-label', '已收起' + fingerName + (guided ? '，數到 ' + (first - counted) : ''));\n        }\n        showCount();\n        if (counted === second) {\n          el('choices').hidden = false;\n          if (backwards && event.detail === 0) el('choices').firstElementChild?.focus();\n        } else if (backwards) {\n          fingers[counted].disabled = false;\n          if (event.detail === 0) fingers[counted].focus();\n        }\n      };\n      fingers.push(button);\n      row.append(button);\n    }\n    group.append(row, palm);\n    el('hands').append(group);\n  }\n}\n\nfunction showQuestion() {\n  const [first, second] = questionData();\n  counted = 0;\n  solved = false;\n  completed = false;\n  const total = backwards ? first - second : first + second;\n  el('progress').textContent = '階段 ' + stage + ' · 第 ' + (question + 1) + ' / ' + questionCount() + ' 題';\n  el('equation').textContent = first + operator + second + ' ＝ ？';\n  el('instruction').textContent = backwards\n    ? '點一下愛心，把 ' + first + ' 擺喺心。'\n    : first + ' 放在心裏。伸出 ' + second + ' 隻手指。';\n  el('start-count').hidden = !backwards;\n  el('count').hidden = backwards;\n  el('hands').hidden = backwards;\n  el('steps').hidden = backwards;\n  if (backwards) {\n    el('heart-number').textContent = first;\n    el('start-count').setAttribute('aria-label', '把 ' + first + ' 擺喺心');\n  }\n  showCount();\n  renderHands(second);\n  el('choices').replaceChildren();\n  const alternatives = total === 0 ? [0, 1, 2] : [total - 1, total, total + 1];\n  if (stage === 1) alternatives.splice(2);\n  const rotation = question % alternatives.length;\n  const answers = alternatives.slice(rotation).concat(alternatives.slice(0, rotation));\n  for (const value of answers) {\n    const button = document.createElement('button');\n    button.className = 'choice';\n    button.textContent = value;\n    button.onclick = () => {\n      if (value !== total) {\n        showFeedback('再想一想。最後一隻手指數到多少？');\n        el('hint').hidden = false;\n        return;\n      }\n      solved = true;\n      el('equation').textContent = first + operator + second + ' ＝ ' + total;\n      showFeedback('答對了！最後數到 ' + total + '。', true);\n      for (const option of el('choices').children) option.disabled = true;\n      el('next').hidden = false;\n      el('next').textContent = question + 1 === questionCount() ? '完成 →' : '下一題 →';\n      el('hint').hidden = true;\n    };\n    el('choices').append(button);\n  }\n  el('choices').hidden = true;\n  el('next').hidden = true;\n  el('reset').hidden = false;\n  el('hint').hidden = guided || backwards;\n  showFeedback('');\n}\n\nfunction restart() {\n  question = 0;\n  el('stage1').setAttribute('aria-pressed', stage === 1);\n  el('stage2').setAttribute('aria-pressed', stage === 2);\n  el('guided').setAttribute('aria-pressed', guided);\n  el('challenge').setAttribute('aria-pressed', !guided);\n  showQuestion();\n}\n\nel('stage1').onclick = () => { if (stage !== 1) { stage = 1; restart(); } };\nel('stage2').onclick = () => { if (stage !== 2) { stage = 2; restart(); } };\nel('guided').onclick = () => { if (!guided) { guided = true; restart(); } };\nel('challenge').onclick = () => { if (guided) { guided = false; restart(); } };\nel('reset').onclick = showQuestion;\nel('start-count').onclick = event => {\n  const [, second] = questionData();\n  el('start-count').hidden = true;\n  el('count').hidden = false;\n  el('hands').hidden = false;\n  el('steps').hidden = false;\n  el('hint').hidden = guided;\n  el('instruction').textContent = '伸出 ' + second + ' 隻手指。點亮起的手指。';\n  if (event.detail === 0) el('hands').querySelector('.finger:not(:disabled)')?.focus();\n};\nel('hint').onclick = () => {\n  const [first] = questionData();\n  showFeedback('心裏是 ' + first + '。第一隻手指由 ' + (backwards ? first - 1 : first + 1) + ' 開始數。');\n};\nel('next').onclick = () => {\n  if (completed) { restart(); return; }\n  if (!solved) return;\n  if (question + 1 < questionCount()) {\n    question++;\n    showQuestion();\n    return;\n  }\n  completed = true;\n  el('progress').textContent = '完成 ' + questionCount() + ' 題';\n  el('equation').textContent = '做得好！';\n  el('instruction').textContent = '試用自己的手指，再做一道新題。';\n  el('count').textContent = backwards ? '心裏的數 → 向後數' : '心裏的數 → 下一個數';\n  el('steps').textContent = '';\n  el('hands').replaceChildren();\n  el('choices').hidden = true;\n  el('reset').hidden = true;\n  el('hint').hidden = true;\n  el('next').textContent = '再玩一次';\n  showFeedback('');\n};\nrestart();\n<\/script>\n</body>\n</html>\n";
const fingerFrame = document.getElementById('finger-frame');
let fingerSizeObserver;

fingerFrame.addEventListener('load', () => {
  fingerSizeObserver?.disconnect();
  const body = fingerFrame.contentDocument?.body;
  if (!body) return;
  const fit = () => {
    if (!fingerFrame.closest('[hidden]')) {
      fingerFrame.style.height = Math.max(body.scrollHeight, 500) + 'px';
    }
  };
  fit();
  if ('ResizeObserver' in window) {
    fingerSizeObserver = new ResizeObserver(fit);
    fingerSizeObserver.observe(body);
  }
});
